<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  
  <title>Frontend Mentor | Results summary component</title>

  <link rel="stylesheet" href="style.css">
  
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <main>
    <section class="container">
      <section class="blue-box">
          <p class="your-result">Your Result</p>
          <div>
            <div class="final-marks">
              <h1>76</h1>
            <p>of 100</p>
            </div>
          </div>
          <h3>Great</h3>
        <p class="para">You scored higher than 65% of the people who have taken these tests.</p>
      </section>
      <section class="white-box">
        <p class="summary">Summary</p>

        <div id="summary-list"></div>
        
        <button class="btn">Continue</button>
      </section>
    </section>
  </main>
  <footer class="attribution">
    <span>Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Sakshi</a>.</span>
  </footer>
</body>
<script src="script.js"></script>
</html>
